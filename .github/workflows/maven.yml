
name: java CI/CD Pipeline

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup=-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'

            - name: Compile Java Program
              run: javac dj.java

            - name: Run Java Program
              run: java dj
